# WKCC/Oregon map overlay configuration (S3d-D2).
# Values copied from the S3d engine defaults so the dataset owns the live map
# behavior before the engine defaults are genericized.
center:
- 44.0
- -120.5
zoom: 7
bbox:
- -124.7
- 41.9
- -116.4
- 46.3
layers:
- key: obstructions
  label: Obstructions
  color: '#ff00ff'
  shape: triangle
  size: 16
  z_index: 200
  default_on: false
  popup: obstructions
  popup_link: https://geo.maps.arcgis.com/apps/dashboards/59f4dfde321f447b9245a1451c83e054
  output_filename: osmb-obstructions.geojson
  endpoint: https://services.arcgis.com/uUvqNMGPm7axC2dD/arcgis/rest/services/BORT_Public_View/FeatureServer/0
  out_fields:
  - waterbody
  - waterbodysec
  - obslocation
  - obsdescript
  - recordtime
- key: dams
  label: Dams / weirs
  color: '#6a1b9a'
  shape: diamond
  size: 14
  z_index: 100
  default_on: false
  popup: dams
  popup_link: https://www.oregon.gov/osmb/boating-facilities/Pages/Maps-and-Apps.aspx
  output_filename: osmb-dams.geojson
  endpoint: https://services.arcgis.com/uUvqNMGPm7axC2dD/arcgis/rest/services/service_d258e7b477f546d0917e868b1330ab3c/FeatureServer/0
  out_fields:
  - damname
  - waterbody
  - damheight
  - damwidth
  - portagedesc
  - navigate
- key: access
  label: Access sites
  color: '#1b5e20'
  shape: circle
  size: 5
  z_index: 0
  default_on: false
  popup: access
  popup_link: https://experience.arcgis.com/experience/72308dd6b893451690a14437cde89be8
  output_filename: osmb-access-sites.geojson
  endpoint: https://services.arcgis.com/uUvqNMGPm7axC2dD/arcgis/rest/services/Boating_Access_Sites_OA/FeatureServer/0
  out_fields:
  - name
  - waterway_name
  - facility_type
  - launch_type

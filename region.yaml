# Region presentation — see kayak.dataset.region (RegionConfig) in the kayak engine.
#
# Per-state curated external-resource links + the "Weather" nav URL for the WKCC
# deployment. The engine reads this with resolution: engine defaults < this file
# (a present file fully DEFINES the set — replace, not per-state merge — so it must
# list every state that should have a landing page + nav button + curated links).
# Validated by `levels validate-dataset` (_check_region_yaml); build-side only (PHP
# renders no per-state links). Values match the engine defaults, so the rendered
# site is unchanged; declaring them here makes the dataset the source of truth so the
# engine defaults can be genericized (S3i) without changing the WKCC site.
default_weather_url: https://www.windy.com/?43.0,-118.0,6

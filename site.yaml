# Site identity — see kayak.dataset.site (SiteConfig) in the kayak engine.
#
# This is the WKCC deployment's branding/identity. The engine reads it with
# resolution: engine defaults < this site.yaml < allowed host env. Validated by
# `levels validate-dataset` (_check_site_yaml) and emitted into the runtime-config
# JSON for PHP by `levels emit-config`. The values below currently match the
# engine's built-in defaults, so the rendered site is unchanged; declaring them
# explicitly makes this dataset the source of truth for identity, so the engine
# defaults can later be genericized (S3i) without changing the WKCC site.
site_name: WKCC River Levels
org_name: Willamette Kayak and Canoe Club
org_url: https://wkcc.org
brand_color: "#1b5591"
brand_color_dark: "#0d3057"
attribution: levels.wkcc.org
